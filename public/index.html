<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Anime Archive Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0f1a;--surface:#121a2b;--surface-2:#182338;--border:#223049;--border-soft:#1a2438;
    --text:#eaf0fa;--text-dim:#9db0c9;--text-faint:#5f7291;
    --accent:#5b8cff;--accent-soft:#5b8cff26;--teal:#2dd4bf;--teal-soft:#2dd4bf22;
    --danger:#f2536a;--danger-soft:#f2536a20;--amber:#f5b94a;--amber-soft:#f5b94a20;
    --radius-lg:16px;--radius-md:10px;--radius-sm:7px;
    --font:"Inter","Vazirmatn",-apple-system,Segoe UI,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{
    font-family:var(--font);
    background:radial-gradient(1100px 500px at 15% -10%,#16213a 0%,transparent 60%),radial-gradient(900px 460px at 100% 0%,#10233a 0%,transparent 55%),var(--bg);
    color:var(--text);margin:0;padding:22px 22px 60px;min-height:100vh;
  }
  .wrap{max-width:1180px;margin:0 auto}
  .topbar{position:sticky;top:12px;z-index:20;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;
    background:rgba(18,26,43,.86);backdrop-filter:blur(10px);border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:16px 20px;margin-bottom:20px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand-icon{width:38px;height:38px;border-radius:11px;flex-shrink:0;background:linear-gradient(145deg,var(--accent),#7c5cff);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px -6px #5b8cff88}
  h1{font-size:16px;font-weight:700;margin:0;letter-spacing:-.01em}
  .stats{color:var(--text-dim);font-size:12.5px;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .stats b{color:var(--text);font-weight:600}.stats .dot{color:var(--text-faint)}
  .controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .search-box{position:relative;display:flex;align-items:center}
  .search-box svg{position:absolute;left:12px;width:15px;height:15px;color:var(--text-faint);pointer-events:none}
  input[type="text"]{background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:9px 14px 9px 34px;border-radius:var(--radius-md);width:210px;font-family:inherit;font-size:13.5px;transition:border-color .15s,width .2s}
  input[type="text"]:focus{outline:none;border-color:var(--accent);width:240px}
  input[type="text"]::placeholder{color:var(--text-faint)}
  select{background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:var(--radius-md);font-family:inherit;font-size:13px;cursor:pointer;max-width:200px}
  select:focus{outline:none;border-color:var(--accent)}
  .icon-btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);width:34px;height:34px;border-radius:var(--radius-md);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:color .15s,border-color .15s,transform .15s}
  .icon-btn:hover{color:var(--text);border-color:var(--accent)}.icon-btn:active{transform:scale(.92)}
  .icon-btn svg{width:16px;height:16px}.icon-btn.spin svg{animation:spin .6s linear}
  .icon-btn.active{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .btn{border:0;padding:8px 14px;border-radius:var(--radius-sm);cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600;transition:filter .15s,transform .15s;display:inline-flex;align-items:center;gap:5px}
  .btn:active{transform:scale(.96)}.btn svg{width:13px;height:13px}
  .btn-danger{background:var(--danger-soft);color:var(--danger);border:1px solid #f2536a3d}
  .btn-danger:hover{background:var(--danger);color:#fff}
  .btn-open{background:var(--teal-soft);color:var(--teal);border:1px solid #2dd4bf3d;text-decoration:none}
  .btn-open:hover{background:var(--teal);color:#06201c}
  .btn-bot{background:var(--accent-soft);color:var(--accent);border:1px solid #5b8cff3d;text-decoration:none}
  .btn-bot:hover{background:var(--accent);color:#fff}
  .btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border)}
  .btn-ghost:hover{color:var(--text);border-color:var(--accent)}
  .btn-copy{background:transparent;color:var(--text-faint);border:1px solid var(--border);padding:8px 9px}
  .btn-copy:hover{color:var(--accent);border-color:var(--accent)}
  .selection-bar{display:none;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:10px 16px;margin-bottom:16px;font-size:13px}
  .selection-bar.show{display:flex}
  .selection-bar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .selection-bar .btn-ghost,.selection-bar .btn{padding:7px 13px;font-size:12.5px}
  #selectDeleteBtn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
  .title-line{display:flex;align-items:center;gap:8px;min-width:0}
  .row-checkbox{width:18px;height:18px;border:1.5px solid var(--border);border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,border-color .15s}
  .row-checkbox svg{width:11px;height:11px;color:#fff;display:none}
  .row-checkbox.checked{background:var(--accent);border-color:var(--accent)}.row-checkbox.checked svg{display:block}
  tbody tr.song-row.selected{background:var(--accent-soft)}
  .is-selecting .chevron-cell .chevron-btn{visibility:hidden;pointer-events:none}
  .table-shell{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:11px 14px;text-align:left;vertical-align:middle}
  thead th{background:var(--surface-2);color:var(--text-faint);font-weight:600;font-size:11.5px;border-bottom:1px solid var(--border);user-select:none;white-space:nowrap}
  th.sortable{cursor:pointer;transition:color .15s}th.sortable:hover{color:var(--text)}
  th.sortable .arrow{display:inline-block;margin-left:4px;opacity:.3;font-size:10px}
  th.sortable.active .arrow{opacity:1;color:var(--accent)}
  tbody tr.song-row{border-bottom:1px solid var(--border-soft);transition:background .12s;cursor:pointer}
  tbody tr.song-row:hover{background:var(--surface-2)}
  tbody tr.detail-row{background:#0d1524;border-bottom:1px solid var(--border-soft)}
  tbody tr.detail-row.hidden{display:none}
  .muted{color:var(--text-faint);font-size:12px}
  .empty{text-align:center;padding:56px 20px;color:var(--text-faint)}
  .empty svg{width:34px;height:34px;margin-bottom:10px;opacity:.5}
  .title-cell{font-weight:600;color:var(--text)}
  .artist-cell{color:var(--text-dim);display:none}
  .dur-pill{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--border);padding:3px 9px;border-radius:999px;font-size:12px;color:var(--text-dim);font-family:var(--mono)}
  .dup-badge,.gap-badge{display:inline-flex;align-items:center;padding:1px 7px;border-radius:999px;font-size:10.5px;font-weight:700;margin-inline-start:6px;letter-spacing:.02em;white-space:nowrap}
  .dup-badge{background:var(--danger-soft);border:1px solid var(--danger);color:var(--danger)}
  .gap-badge{background:var(--amber-soft);border:1px solid var(--amber);color:var(--amber)}
  .checkbox-label{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-dim);cursor:pointer;user-select:none;background:var(--surface);border:1px solid var(--border);padding:8px 12px;border-radius:var(--radius-sm)}
  .checkbox-label input{accent-color:var(--danger);width:14px;height:14px;cursor:pointer}
  .checkbox-label.gap input{accent-color:var(--amber)}
  .chevron-cell{width:34px;text-align:right}
  .chevron-btn{background:transparent;border:0;color:var(--text-faint);cursor:pointer;padding:4px;display:flex;align-items:center;justify-content:center;transition:transform .18s,color .15s}
  .chevron-btn svg{width:15px;height:15px}
  .song-row.open .chevron-btn{transform:rotate(180deg);color:var(--accent)}
  .detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:14px 4px 4px}
  .detail-label{display:block;color:var(--text-faint);font-size:10.5px;margin-bottom:3px}
  .detail-value{font-family:var(--mono);font-size:12.5px;color:var(--text-dim);word-break:break-all}
  .detail-value.fa{font-family:var(--font)}
  .detail-wide{grid-column:1/-1}
  .miss-list{display:flex;gap:6px;flex-wrap:wrap}
  .miss-list span{background:var(--amber-soft);border:1px solid #f5b94a3d;color:var(--amber);padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600}
  .detail-actions{display:flex;gap:6px;flex-wrap:wrap;padding:14px 4px 4px}
  .pager{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--border-soft);background:var(--surface-2);font-size:12.5px;color:var(--text-dim);gap:10px;flex-wrap:wrap}
  .pager-btns{display:flex;gap:6px;align-items:center}
  .pager .btn-ghost{padding:6px 12px;font-size:12.5px}.pager .btn-ghost:disabled{opacity:.4;cursor:not-allowed}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:#16a34a;color:#fff;padding:11px 20px;border-radius:10px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;font-size:13.5px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px -8px #000a;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast.error{background:var(--danger)}
  .modal-backdrop{position:fixed;inset:0;background:#05070ecc;backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
  .modal-backdrop.show{opacity:1;pointer-events:auto}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;width:320px;max-width:90vw;transform:scale(.94) translateY(6px);transition:transform .18s;text-align:center}
  .modal-backdrop.show .modal{transform:scale(1) translateY(0)}
  .modal-icon{width:42px;height:42px;border-radius:50%;background:var(--danger-soft);color:var(--danger);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .modal p{font-size:13.5px;color:var(--text-dim);margin:0 0 18px;line-height:1.7}.modal p b{color:var(--text)}
  .modal-btns{display:flex;gap:8px}.modal-btns .btn,.modal-btns .btn-ghost{flex:1;justify-content:center;padding:9px}
  .error-banner{background:#7f1d1d;color:#fff;padding:12px 16px;border-radius:10px;margin-bottom:16px;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;word-break:break-all;display:none}
  .error-banner.show{display:block}
  @media (max-width:760px){
    body{padding:14px 12px 50px}
    .topbar{position:static;padding:14px}
    .controls{width:100%}.controls select{flex:1 1 auto;min-width:0;max-width:none}
    .search-box{flex:1 1 100%;order:3}.search-box,input[type="text"]{width:100%}
    #refreshBtn{order:4;margin-left:auto}
    thead{display:none}table,tbody,tr,td{display:block;width:100%}
    tbody tr.song-row{display:flex;align-items:center;justify-content:space-between;padding:11px 10px 11px 20px;border-bottom:1px solid var(--border-soft);gap:8px}
    tbody tr.song-row td{padding:0;border:0;width:auto}
    td.cell-main{flex:1;min-width:0}td.cell-artist{display:none}
    .title-cell{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .artist-cell{display:block!important;font-size:12px;margin-top:1px}
    td.cell-meta{display:flex;align-items:center;gap:8px;flex-shrink:0}
    td.cell-meta.hide-m{display:none}
    td.cell-meta .muted{font-size:10.5px;white-space:nowrap}
    .dur-pill{padding:2px 6px;font-size:10.5px}
    td.chevron-cell{flex-shrink:0;width:auto}
    tbody tr.detail-row td{padding:0 10px 12px 20px}
    .detail-grid{grid-template-columns:1fr 1fr;gap:10px 14px}
    .detail-actions{flex-direction:column;align-items:stretch}
    .detail-actions .btn,.detail-actions .btn-copy{justify-content:center;width:100%}
    .pager{flex-direction:column;align-items:stretch;text-align:center;gap:12px;padding:14px}
    .pager-btns{flex-wrap:wrap;justify-content:center;gap:8px}
    .pager-btns label{width:100%;justify-content:center}
    .pager-btns #prevPage,.pager-btns #nextPage{flex:1 1 0;min-width:90px}
    .pager-btns #pageIndicator{width:100%;order:3}
    .selection-bar{flex-direction:column;align-items:stretch}
    .selection-bar-right{justify-content:space-between}
    .selection-bar-right .btn-ghost,.selection-bar-right .btn{flex:1;justify-content:center}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="error-banner" id="errorBanner"></div>

  <div class="topbar">
    <div class="brand">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2.5" stroke="#fff" stroke-width="1.8"/><path d="m10.5 9.5 4 2.5-4 2.5z" fill="#fff"/></svg>
      </div>
      <div>
        <h1>Anime Archive Admin</h1>
        <div class="stats" id="stats">Loading...</div>
      </div>
    </div>
    <div class="controls">
      <label class="checkbox-label"><input type="checkbox" id="duplicatesOnly" /> Duplicates only</label>
      <label class="checkbox-label gap"><input type="checkbox" id="gapOnly" /> Missing eps only</label>
      <select id="typeFilter">
        <option value="">All types</option>
        <option value="video">🎬 Video</option>
        <option value="subtitle">📝 Subtitle</option>
        <option value="other">📁 Other</option>
      </select>
      <select id="animeFilter"><option value="">All anime</option></select>
      <select id="sortSelect">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="title">Title (A-Z)</option>
        <option value="episode">Episode (1-9)</option>
      </select>
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m21 21-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="text" id="q" placeholder="Search anime title..." autocomplete="off" />
      </div>
      <button class="icon-btn" id="selectModeBtn" title="Select multiple">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 18h8"/></svg>
      </button>
      <button class="icon-btn" id="refreshBtn" title="Refresh list">
        <svg viewBox="0 0 24 24" fill="none"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <div class="selection-bar" id="selectionBar">
    <button class="btn-ghost" id="selectAllBtn">Select all</button>
    <div class="selection-bar-right">
      <span id="selectionCount" class="muted">0 selected</span>
      <button class="btn-ghost" id="selectCancelBtn">Cancel</button>
      <button class="btn btn-danger" id="selectDeleteBtn" style="background:var(--danger);color:#fff;border:0;">Delete selected</button>
    </div>
  </div>

  <div class="table-shell">
    <table>
      <thead>
        <tr>
          <th class="sortable" data-key="name">Title<span class="arrow">▲</span></th>
          <th class="sortable" data-key="ep" style="width:120px">Episode<span class="arrow">▲</span></th>
          <th class="sortable" data-key="type" style="width:110px">Type<span class="arrow">▲</span></th>
          <th class="sortable" data-key="date" style="width:110px">Date<span class="arrow">▲</span></th>
          <th style="width:34px"></th>
        </tr>
      </thead>
      <tbody id="rows"><tr><td colspan="5" class="empty">Loading...</td></tr></tbody>
    </table>
    <div class="pager" id="pager">
      <div id="pagerInfo"></div>
      <div class="pager-btns">
        <label class="muted" style="display:flex;align-items:center;gap:6px;">Per page
          <select id="pageSizeSelect"><option value="10">10</option><option value="15" selected>15</option><option value="25">25</option><option value="50">50</option><option value="100">100</option></select>
        </label>
        <button class="btn-ghost" id="prevPage">Previous</button>
        <span id="pageIndicator" class="muted"></span>
        <button class="btn-ghost" id="nextPage">Next</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-backdrop" id="confirmModal">
  <div class="modal">
    <div class="modal-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <p>Delete <b id="confirmTitle" dir="auto"></b> from the database?<br>The channel message stays untouched.</p>
    <div class="modal-btns">
      <button class="btn-ghost" id="confirmCancel">Cancel</button>
      <button class="btn" id="confirmOk" style="background:var(--danger);color:#fff;">Delete</button>
    </div>
  </div>
</div>

<script>
  var $ = function (id) { return document.getElementById(id); };
  function showError(msg) { var b = $("errorBanner"); b.textContent = "ERROR: " + msg; b.classList.add("show"); }
  window.addEventListener("error", function (e) { showError(e.message + " @ " + (e.lineno || "")); });
  window.addEventListener("unhandledrejection", function (e) { showError((e.reason && e.reason.message) || String(e.reason)); });

  function apiUrl(path) { return path; }

  var qInput = $("q"), rowsEl = $("rows"), statsEl = $("stats"), toastEl = $("toast"),
      animeFilter = $("animeFilter"), typeFilter = $("typeFilter"), duplicatesOnly = $("duplicatesOnly"),
      gapOnly = $("gapOnly"), sortSelect = $("sortSelect"), pagerEl = $("pager"), pagerInfo = $("pagerInfo"),
      pageIndicator = $("pageIndicator"), refreshBtn = $("refreshBtn"), pageSizeSelect = $("pageSizeSelect"),
      selectModeBtn = $("selectModeBtn"), selectionBar = $("selectionBar"), selectionCount = $("selectionCount"),
      selectAllBtn = $("selectAllBtn"), selectCancelBtn = $("selectCancelBtn"), selectDeleteBtn = $("selectDeleteBtn");

  var allPosts = [], dupKeys = new Set(), missingByName = {};
  var currentPage = 1, PAGE_SIZE = 15, pendingDeleteId = null, pendingBulkDelete = false,
      openDetailId = null, selectionMode = false, selectedIds = new Set(), currentPageIds = [];

  function fetchWithTimeout(url, opts, ms) {
    var ctrl = new AbortController();
    var t = setTimeout(function () { ctrl.abort(); }, ms || 12000);
    return fetch(url, Object.assign({}, opts || {}, { signal: ctrl.signal })).finally(function () { clearTimeout(t); });
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }
  function toast(msg, isError) {
    toastEl.innerHTML = (isError
      ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#fff" stroke-width="2"/><path d="M12 8v5M12 16h.01" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>'
      : '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M20 6 9 17l-5-5" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>')
      + "<span>" + esc(msg) + "</span>";
    toastEl.className = "toast show" + (isError ? " error" : "");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toastEl.className = "toast"; }, 2500);
  }
  var fmtDate = function (d) { return String(d || "").slice(0, 10); };
  var epLabel = function (p) { return p.ep != null ? "EP " + p.ep : "-"; };
  // تکراری = نام کامل فایل (بدون پسوند) یکسان + دسته یکسان
  var dupKey = function (p) { return String(p.title || p.name).trim().toLowerCase() + "|" + p.category; };
  // قسمت‌های ناقص برای هر انیمه و هر دسته (ویدیو/زیرنویس) جدا حساب می‌شه
  var gapKey = function (p) { return p.name + "|" + p.category; };
  var MAX_GAP_EP = 2000; // شماره‌های غیرعادی (مثلا سال) باعث لیست غول‌پیکر نشن

  function computeDerived() {
    var counts = {}, eps = {};
    allPosts.forEach(function (p) {
      var k = dupKey(p);
      if (k) counts[k] = (counts[k] || 0) + 1;
      if (p.ep != null && p.ep <= MAX_GAP_EP) (eps[gapKey(p)] = eps[gapKey(p)] || new Set()).add(p.ep);
    });
    dupKeys = new Set(Object.keys(counts).filter(function (k) { return counts[k] > 1; }));
    missingByName = {};
    Object.keys(eps).forEach(function (k) {
      var mx = Math.max.apply(null, Array.from(eps[k])), miss = [];
      for (var i = 1; i <= mx; i++) if (!eps[k].has(i)) miss.push(i);
      if (miss.length) missingByName[k] = miss;
    });
  }

  async function load() {
    try {
      statsEl.textContent = "Loading...";
      var res = await fetchWithTimeout(apiUrl("/api/admin/list"), {}, 12000);
      if (!res.ok) throw new Error("Failed to load list (" + res.status + ")");
      allPosts = await res.json();
      computeDerived();
      populateAnimeFilter();
      render();
    } catch (e) {
      showError(e.message || String(e));
      rowsEl.innerHTML = '<tr><td colspan="5"><div class="empty">' + esc(e.message || "Load failed") + "</div></td></tr>";
      pagerEl.style.display = "none"; statsEl.textContent = "";
    }
  }

  function populateAnimeFilter() {
    var cur = animeFilter.value, set = new Set();
    allPosts.forEach(function (p) { set.add(p.name); });
    var names = Array.from(set).sort(function (a, b) { return a.localeCompare(b); });
    animeFilter.innerHTML = '<option value="">All anime</option>' + names.map(function (n) { return '<option value="' + esc(n) + '">' + esc(n) + "</option>"; }).join("");
    animeFilter.value = names.indexOf(cur) !== -1 ? cur : "";
  }

  function getSortState() {
    switch (sortSelect.value) {
      case "oldest": return { key: "id", dir: 1 };
      case "title": return { key: "name", dir: 1 };
      case "episode": return { key: "ep", dir: 1 };
      default: return { key: "id", dir: -1 };
    }
  }

  function getFiltered() {
    var q = qInput.value.trim().toLowerCase(), anime = animeFilter.value, type = typeFilter.value;
    var list = allPosts.filter(function (p) {
      if (anime && p.name !== anime) return false;
      if (type && p.category !== type) return false;
      if (duplicatesOnly.checked && !dupKeys.has(dupKey(p))) return false;
      if (gapOnly.checked && !missingByName[gapKey(p)]) return false;
      if (q && p.name.toLowerCase().indexOf(q) === -1 && String(p.caption || "").toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    var s = (duplicatesOnly.checked || sortSelect.value === "episode" || sortSelect.value === "title")
      ? { key: sortSelect.value === "episode" ? "ep" : "name", dir: 1 } : getSortState();
    var byName = s.key === "name" || s.key === "ep";
    return list.slice().sort(function (a, b) {
      var c;
      if (byName) {
        c = a.name.localeCompare(b.name);
        if (c === 0) c = (a.ep == null ? 1e9 : a.ep) - (b.ep == null ? 1e9 : b.ep);
        return s.key === "name" || c !== 0 ? c : 0;
      }
      var va = a[s.key], vb = b[s.key];
      if (typeof va === "string") { va = va.toLowerCase(); vb = String(vb || "").toLowerCase(); }
      return va < vb ? -1 * s.dir : va > vb ? 1 * s.dir : 0;
    });
  }

  function updateStats(n) {
    var animeCount = new Set(allPosts.map(function (p) { return p.name; })).size;
    var gaps = 0; Object.keys(missingByName).forEach(function (k) { gaps += missingByName[k].length; });
    var h = "<span><b>" + animeCount + "</b> anime</span><span class='dot'>&middot;</span><span><b>" + allPosts.length + "</b> posts</span>";
    if (gaps) h += "<span class='dot'>&middot;</span><span style='color:var(--amber)'><b>" + gaps + "</b> missing episode" + (gaps > 1 ? "s" : "") + "</span>";
    if (dupKeys.size) h += "<span class='dot'>&middot;</span><span style='color:var(--danger)'><b>" + dupKeys.size + "</b> duplicate" + (dupKeys.size > 1 ? "s" : "") + "</span>";
    if (n !== allPosts.length) h += "<span class='dot'>&middot;</span><span><b>" + n + "</b> results found</span>";
    statsEl.innerHTML = h;
  }

  function updateSortHeaders() {
    var s = sortSelect.value, active = { newest: ["date", -1], oldest: ["date", 1], title: ["name", 1], episode: ["ep", 1] }[s];
    document.querySelectorAll("th.sortable").forEach(function (th) {
      var a = th.querySelector(".arrow");
      if (th.dataset.key === active[0]) { th.classList.add("active"); a.textContent = active[1] === 1 ? "▲" : "▼"; }
      else { th.classList.remove("active"); a.textContent = "▲"; }
    });
  }

  function render() {
    var filtered = getFiltered();
    updateStats(filtered.length); updateSortHeaders();
    if (!filtered.length) {
      rowsEl.innerHTML = '<tr><td colspan="5"><div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><div>Nothing found.</div></div></td></tr>';
      pagerEl.style.display = "none"; currentPageIds = []; return;
    }
    var totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    currentPage = Math.min(currentPage, totalPages);
    var start = (currentPage - 1) * PAGE_SIZE, items = filtered.slice(start, start + PAGE_SIZE);
    currentPageIds = items.map(function (p) { return p.id; });
    rowsEl.classList.toggle("is-selecting", selectionMode);

    rowsEl.innerHTML = items.map(function (p) {
      var isOpen = openDetailId === p.id, isSel = selectedIds.has(p.id);
      var cb = selectionMode ? '<span class="row-checkbox' + (isSel ? " checked" : "") + '"><svg viewBox="0 0 24 24" fill="none"><path d="M20 6 9 17l-5-5" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' : "";
      var badges = (dupKeys.has(dupKey(p)) ? '<span class="dup-badge">DUPLICATE</span>' : "")
                 + (missingByName[gapKey(p)] ? '<span class="gap-badge">' + missingByName[gapKey(p)].length + " MISSING</span>" : "");
      var typeTxt = esc(p.ext ? "." + p.ext : (p.type || "-")) + (p.files > 1 ? " ×" + p.files : "");
      var categoryLabel = p.category === "video" ? "🎬" : p.category === "subtitle" ? "📝" : "📁";
      var ml = missingByName[gapKey(p)] || [];
      var miss = ml.length
        ? '<div class="detail-wide"><span class="detail-label">Missing episodes</span><div class="miss-list">' + ml.slice(0, 60).map(function (n) { return "<span>EP " + n + "</span>"; }).join("") + (ml.length > 60 ? "<span>+" + (ml.length - 60) + " more</span>" : "") + "</div></div>" : "";
      var botBtns = p.bot_link
        ? '<button class="btn-copy" data-action="copy" data-link="' + esc(p.bot_link) + '" title="Copy bot link"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg> Copy link</button>' +
          '<a class="btn btn-bot" href="' + esc(p.bot_link) + '" target="_blank" rel="noopener" data-action="stop"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 3 3 10.5l6.5 2.5M21 3l-6 18-4.5-8M21 3 9.5 13" stroke-linecap="round" stroke-linejoin="round"/></svg> Send via bot</a>'
        : "";
      return '<tr class="song-row' + (isOpen ? " open" : "") + (isSel ? " selected" : "") + '" data-id="' + p.id + '">' +
        '<td class="cell-main"><span class="title-line">' + cb + '<span class="title-cell" dir="auto">' + categoryLabel + " " + esc(p.name) + "</span>" + badges + '</span><span class="artist-cell">' + epLabel(p) + "</span></td>" +
        '<td class="cell-artist">' + epLabel(p) + "</td>" +
        '<td class="cell-meta"><span class="dur-pill">' + typeTxt + "</span></td>" +
        '<td class="muted cell-meta hide-m">' + esc(fmtDate(p.date)) + "</td>" +
        '<td class="chevron-cell"><button class="chevron-btn" aria-label="Toggle details"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button></td></tr>' +
        '<tr class="detail-row' + (isOpen ? "" : " hidden") + '"><td colspan="5">' +
          '<div class="detail-grid">' +
            '<div class="detail-wide"><span class="detail-label">Caption</span><span class="detail-value fa" dir="auto" style="white-space:pre-wrap">' + esc(p.caption || "-") + "</span></div>" +
            '<div><span class="detail-label">Post ID</span><span class="detail-value">' + p.id + "</span></div>" +
            '<div><span class="detail-label">Files</span><span class="detail-value">' + (p.files || 1) + "</span></div>" +
            '<div><span class="detail-label">Date</span><span class="detail-value">' + esc(p.date) + "</span></div>" + miss +
          "</div>" +
          '<div class="detail-actions">' +
            '<a class="btn btn-open" href="' + esc(p.archive_link) + '" target="_blank" rel="noopener" data-action="stop">Open in Archive</a>' +
            botBtns +
            '<button class="btn btn-danger" data-action="delete" data-id="' + p.id + '" data-title="' + esc(p.name + " " + epLabel(p)) + '">Delete</button>' +
          "</div></td></tr>";
    }).join("");

    pagerEl.style.display = "flex";
    pagerInfo.textContent = "Showing " + (start + 1) + "–" + Math.min(start + PAGE_SIZE, filtered.length) + " of " + filtered.length;
    pageIndicator.textContent = "Page " + currentPage + " of " + totalPages;
    $("prevPage").disabled = currentPage === 1; $("nextPage").disabled = currentPage === totalPages;
    updateSelectionUI();
  }

  function toggleDetails(id) { openDetailId = openDetailId === id ? null : id; render(); }
  function toggleSelect(id) { selectedIds.has(id) ? selectedIds.delete(id) : selectedIds.add(id); render(); }
  function updateSelectionUI() {
    selectModeBtn.classList.toggle("active", selectionMode);
    selectionBar.classList.toggle("show", selectionMode);
    selectionCount.textContent = selectedIds.size + " selected";
    selectDeleteBtn.disabled = selectedIds.size === 0;
    var all = currentPageIds.length > 0 && currentPageIds.every(function (id) { return selectedIds.has(id); });
    selectAllBtn.textContent = all ? "Clear all" : "Select all";
  }

  function copyLink(link) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).then(function () { toast("Link copied"); }, function () { toast("Could not copy link", true); });
    } else {
      var ta = document.createElement("textarea"); ta.value = link; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast("Link copied"); } catch (e) { toast("Could not copy link", true); }
      document.body.removeChild(ta);
    }
  }

  function askDelete(id, title) { pendingBulkDelete = false; pendingDeleteId = id; $("confirmTitle").textContent = title; $("confirmModal").classList.add("show"); }
  function askBulkDelete() {
    if (!selectedIds.size) return;
    pendingBulkDelete = true;
    $("confirmTitle").textContent = selectedIds.size + " selected post" + (selectedIds.size > 1 ? "s" : "");
    $("confirmModal").classList.add("show");
  }
  function closeModal() { $("confirmModal").classList.remove("show"); pendingDeleteId = null; pendingBulkDelete = false; }

  async function deleteIds(ids) {
    var res = await fetchWithTimeout(apiUrl("/api/admin/delete"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ids: ids }) }, 20000);
    var data = await res.json().catch(function () { return {}; });
    if (!res.ok || !data.ok) throw new Error(data.error || "Delete failed");
  }
  async function del(id) {
    try { await deleteIds([id]); toast("Post deleted"); openDetailId = null; await load(); }
    catch (e) { toast(e.message, true); }
  }
  async function bulkDelete() {
    var ids = Array.from(selectedIds);
    try {
      await deleteIds(ids);
      toast(ids.length + " post" + (ids.length > 1 ? "s" : "") + " deleted");
    } catch (e) { toast(e.message, true); }
    selectedIds.clear(); selectionMode = false; openDetailId = null;
    await load();
  }

  rowsEl.addEventListener("click", function (e) {
    var a = e.target.closest("[data-action]");
    if (a) {
      if (a.dataset.action === "stop") return;
      e.preventDefault(); e.stopPropagation();
      if (a.dataset.action === "copy") copyLink(a.dataset.link);
      else if (a.dataset.action === "delete") askDelete(Number(a.dataset.id), a.dataset.title);
      return;
    }
    var row = e.target.closest("tr.song-row");
    if (row) { var id = Number(row.dataset.id); selectionMode ? toggleSelect(id) : toggleDetails(id); }
  });

  $("confirmOk").addEventListener("click", function () {
    var bulk = pendingBulkDelete, id = pendingDeleteId; closeModal();
    if (bulk) bulkDelete(); else if (id != null) del(id);
  });
  $("confirmCancel").addEventListener("click", closeModal);
  $("confirmModal").addEventListener("click", function (e) { if (e.target.id === "confirmModal") closeModal(); });

  selectModeBtn.addEventListener("click", function () { selectionMode = !selectionMode; if (!selectionMode) selectedIds.clear(); openDetailId = null; render(); });
  selectCancelBtn.addEventListener("click", function () { selectionMode = false; selectedIds.clear(); render(); });
  selectAllBtn.addEventListener("click", function () {
    var all = currentPageIds.every(function (id) { return selectedIds.has(id); });
    currentPageIds.forEach(function (id) { all ? selectedIds.delete(id) : selectedIds.add(id); });
    render();
  });
  selectDeleteBtn.addEventListener("click", askBulkDelete);

  document.querySelectorAll("th.sortable").forEach(function (th) {
    th.addEventListener("click", function () {
      var k = th.dataset.key;
      if (k === "date") sortSelect.value = sortSelect.value === "newest" ? "oldest" : "newest";
      else if (k === "name") sortSelect.value = "title";
      else if (k === "ep") sortSelect.value = "episode";
      currentPage = 1; render();
    });
  });

  $("prevPage").addEventListener("click", function () { currentPage--; render(); });
  $("nextPage").addEventListener("click", function () { currentPage++; render(); });
  refreshBtn.addEventListener("click", function () {
    refreshBtn.classList.add("spin"); setTimeout(function () { refreshBtn.classList.remove("spin"); }, 600);
    load(); toast("List refreshed");
  });
  [qInput].forEach(function (el) { el.addEventListener("input", function () { currentPage = 1; render(); }); });
  [animeFilter, typeFilter, duplicatesOnly, gapOnly, sortSelect].forEach(function (el) { el.addEventListener("change", function () { currentPage = 1; render(); }); });
  pageSizeSelect.addEventListener("change", function () { PAGE_SIZE = parseInt(pageSizeSelect.value, 10) || 15; currentPage = 1; render(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });

  load();
</script>
</body>
</html>
